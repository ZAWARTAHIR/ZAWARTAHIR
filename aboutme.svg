<svg width="1000" height="640" viewBox="0 0 1000 640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1000" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#07030f"/>
      <stop offset="55%" stop-color="#160a2c"/>
      <stop offset="100%" stop-color="#1a0b3d"/>
    </linearGradient>

    <linearGradient id="accent" x1="0%" y1="0" x2="100%" y2="0">
      <stop offset="0%" stop-color="#2e1454"/>
      <stop offset="50%" stop-color="#a46bff"/>
      <stop offset="100%" stop-color="#ff2e93">
        <animate attributeName="offset" values="1;1.6;1" dur="4s" repeatCount="indefinite"/>
      </stop>
      <animateTransform attributeName="gradientTransform" type="translate" values="-300 0;1000 0;-300 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect"><animateTransform attributeName="gradientTransform" type="translate" values="-0.5 0;0.5 0;-0.5 0" dur="6s" repeatCount="indefinite"/>
      <stop offset="0%" stop-color="#ff2e93"/>
      <stop offset="55%" stop-color="#a46bff"/>
      <stop offset="100%" stop-color="#7cf7ff"/>
    </linearGradient>

    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff2e93" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ff2e93" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff2e93" stop-opacity="0"/><stop offset="0.5" stop-color="#ff2e93" stop-opacity="0.16"/><stop offset="1" stop-color="#7cf7ff" stop-opacity="0"/></linearGradient><filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>

    <style>
      .card { transition: none; } .fade { animation: fadeIn 1.1s ease-out both; } .rise { animation: riseIn 1.1s cubic-bezier(.2,.7,.2,1) both; } @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } } @keyframes riseIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
      .cardBorder { animation: glow 3.2s ease-in-out infinite; }
      .cardBorder.d1 { animation-delay: 0s; }
      .cardBorder.d2 { animation-delay: 0.5s; }
      .cardBorder.d3 { animation-delay: 1s; }
      .cardBorder.d4 { animation-delay: 1.5s; }
      @keyframes glow {
        0%, 100% { stroke-opacity: 0.35; }
        50% { stroke-opacity: 0.9; }
      }
      .cursor { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 0%,50% { opacity:1; } 50.01%,100% { opacity:0; } }
      .statusDot { animation: pulseDot 1.6s ease-in-out infinite; }
      @keyframes pulseDot { 0%,100% { opacity:1; } 50% { opacity:0.35; } }
    </style>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1000" height="640" rx="18" fill="url(#bg)"/>
  <rect x="0" y="0" width="1000" height="6" rx="3" fill="url(#accent)"/>

  <rect x="-300" y="0" width="300" height="640" fill="url(#sweep)"><animate attributeName="x" values="-300;1000" dur="7s" repeatCount="indefinite"/></rect><!-- faint grid texture -->
  <g stroke="#ffffff" stroke-opacity="0.03">
    <path d="M0,160 H1000"/>
    <path d="M0,320 H1000"/>
    <path d="M0,480 H1000"/>
    <path d="M330,6 V634"/>
    <path d="M660,6 V634"/>
  </g>

  <!-- ============ HEADER ROW ============ -->
  <g class="fade" transform="translate(40,30)">
    <!-- terminal window -->
    <rect x="0" y="0" width="400" height="86" rx="10" fill="#160a2c" stroke="#5a1a8c" stroke-width="1"/>
    <circle cx="16" cy="16" r="4.5" fill="#ff5f56"/>
    <circle cx="32" cy="16" r="4.5" fill="#ffbd2e"/>
    <circle cx="48" cy="16" r="4.5" fill="#27c93f"/>
    <text x="16" y="38" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#bfaee0">[SYSTEM BOOT]</text>
    <text x="16" y="56" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#5dffa8">&gt; Loading Zawar_Tahir_Profile...</text>
    <text x="16" y="74" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#ff2e93">
      [STATUS] &gt; <tspan class="statusDot" fill="#5dffa8">Online ⚡</tspan> | Mode: Full-Stack + Agentic AI<tspan class="cursor">_</tspan>
    </text>

    <!-- name + role -->
    <text x="430" y="34" font-family="'Segoe UI', Arial, sans-serif" font-size="34" font-weight="700" fill="url(#nameGrad)">Zawar Tahir</text>
    <text x="430" y="60" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#bfaee0" letter-spacing="0.3">Full-Stack Web Developer</text>
    <text x="430" y="80" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#bfaee0" letter-spacing="0.3">Agentic AI Developer | Automation Expert</text>
  </g>

  <!-- ============ NETWORK SIGNATURE (top right) ============ -->
  <g class="fade" style="animation-delay:.4s" transform="translate(870,120)">
    <circle cx="0" cy="0" r="130" fill="url(#nodeGlow)" filter="url(#blur)"/>

    <!-- rotating orbit ring -->
    <g>
      <circle cx="0" cy="0" r="78" fill="none" stroke="#a46bff" stroke-opacity="0.4" stroke-width="1.2" stroke-dasharray="4 7"/>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="18s" repeatCount="indefinite"/>
    </g>

    <!-- connecting lines -->
    <g stroke="#7cf7ff" stroke-opacity="0.6" stroke-width="1.3" stroke-dasharray="4 4"><animate attributeName="stroke-dashoffset" values="0;-16" dur="1.2s" repeatCount="indefinite"/>
      <line x1="0" y1="0" x2="-68" y2="-40"/>
      <line x1="0" y1="0" x2="68" y2="-40"/>
      <line x1="0" y1="0" x2="-68" y2="45"/>
      <line x1="0" y1="0" x2="68" y2="45"/>
      <line x1="0" y1="0" x2="0" y2="-80"/>
    </g>

    <!-- traveling pulse along a line -->
    <circle r="3" fill="#7cf7ff">
      <animateMotion dur="2.4s" repeatCount="indefinite" path="M0,0 L0,-80"/>
      <animate attributeName="opacity" values="0;1;0" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#ff2e93">
      <animateMotion dur="2.8s" repeatCount="indefinite" path="M0,0 L68,-40"/>
      <animate attributeName="opacity" values="0;1;0" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#ff2e93">
      <animateMotion dur="3.1s" repeatCount="indefinite" path="M0,0 L-68,45"/>
      <animate attributeName="opacity" values="0;1;0" dur="3.1s" repeatCount="indefinite"/>
    </circle>

    <!-- core node -->
    <circle cx="0" cy="0" r="24" fill="#1a0b3d" stroke="#ff2e93" stroke-width="2">
      <animate attributeName="r" values="24;27;24" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <text x="0" y="5" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#ff2e93" font-weight="700">AI</text>

    <!-- satellite nodes -->
    <g font-family="Consolas, monospace" font-size="10" fill="#ffffff" text-anchor="middle">
      <circle cx="0" cy="-80" r="16" fill="#160a2c" stroke="#7cf7ff" stroke-width="1.5"/>
      <text x="0" y="-76" fill="#7cf7ff">n8n</text>

      <circle cx="-68" cy="-40" r="16" fill="#160a2c" stroke="#a46bff" stroke-width="1.5"/>
      <text x="-68" y="-36" fill="#a46bff">JS</text>

      <circle cx="68" cy="-40" r="16" fill="#160a2c" stroke="#a46bff" stroke-width="1.5"/>
      <text x="68" y="-36" fill="#a46bff">API</text>

      <circle cx="-68" cy="45" r="16" fill="#160a2c" stroke="#7cf7ff" stroke-width="1.5"/>
      <text x="-68" y="49" fill="#7cf7ff">DB</text>

      <circle cx="68" cy="45" r="16" fill="#160a2c" stroke="#7cf7ff" stroke-width="1.5"/>
      <text x="68" y="49" fill="#7cf7ff">UI</text>
    </g>
  </g>
  <text x="870" y="280" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#bfaee0">agentic workflow · always learning</text>

  <!-- ============ INTRO PARAGRAPHS ============ -->
  <g class="rise" style="animation-delay:.5s" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#ece3ff">
    <text x="40" y="160">
      <tspan x="40" dy="0">Hey there! I'm <tspan fill="#ffffff" font-weight="600">Zawar Tahir</tspan> — a passionate developer who bridges the gap</tspan>
      <tspan x="40" dy="21">between traditional, robust web development and next-generation</tspan>
      <tspan x="40" dy="21">intelligent automation.</tspan>
    </text>

    <text x="40" y="252">
      <tspan x="40" dy="0" fill="#ffffff" font-weight="600">🎯 What drives me?</tspan>
      <tspan x="40" dy="21">Transforming complex business ideas into seamless, high-performance</tspan>
      <tspan x="40" dy="21">digital assets. I specialize in building full-stack applications with the</tspan>
      <tspan x="40" dy="21"><tspan fill="#7cf7ff">MERN Stack</tspan> and expanding boundaries with <tspan fill="#ff2e93">Agentic AI</tspan> to create smart,</tspan>
      <tspan x="40" dy="21">self-improving digital teammates. My goal is to craft scalable</tspan>
      <tspan x="40" dy="21">architectures and intelligent workflows that deliver measurable results.</tspan>
    </text>
  </g>

  <!-- ============ QUICK HIGHLIGHTS GRID ============ -->
  <g class="rise" style="animation-delay:.9s" font-family="'Segoe UI', Arial, sans-serif">
    <text x="40" y="410" font-size="15" font-weight="700" fill="#ffffff">🚀 Quick Highlights</text>

    <!-- card 1 -->
    <rect x="40" y="425" width="440" height="92" rx="10" fill="#160a2c" stroke="#a46bff" stroke-width="1.2" class="cardBorder d1"/>
    <text x="60" y="452" font-size="13.5" fill="#7cf7ff" font-weight="600">🔭 Currently working on</text>
    <text x="60" y="474" font-size="12.5" fill="#ece3ff">Advanced Blog Automation &amp; Autonomous</text>
    <text x="60" y="491" font-size="12.5" fill="#ece3ff">AI Workflows</text>

    <!-- card 2 -->
    <rect x="500" y="425" width="440" height="92" rx="10" fill="#160a2c" stroke="#a46bff" stroke-width="1.2" class="cardBorder d2"/>
    <text x="520" y="452" font-size="13.5" fill="#a46bff" font-weight="600">🌱 Mastering</text>
    <text x="520" y="474" font-size="12.5" fill="#ece3ff">Deep diving into n8n Automation, Advanced</text>
    <text x="520" y="491" font-size="12.5" fill="#ece3ff">Prompt Engineering, and Platform Scaling</text>

    <!-- card 3 -->
    <rect x="40" y="527" width="440" height="92" rx="10" fill="#160a2c" stroke="#a46bff" stroke-width="1.2" class="cardBorder d3"/>
    <text x="60" y="554" font-size="13.5" fill="#ff2e93" font-weight="600">💬 Ask me about</text>
    <text x="60" y="576" font-size="12.5" fill="#ece3ff">React, Node.js, MongoDB, Agentic AI,</text>
    <text x="60" y="593" font-size="12.5" fill="#ece3ff">UI/UX, or SEO Optimization</text>

    <!-- card 4 -->
    <rect x="500" y="527" width="440" height="92" rx="10" fill="#160a2c" stroke="#a46bff" stroke-width="1.2" class="cardBorder d4"/>
    <text x="520" y="552" font-size="13.5" fill="#ffd23f" font-weight="600">⚡ Fun Fact</text>
    <text x="520" y="572" font-size="11.5" fill="#ece3ff">I once tried to build an AI agent to auto-reply</text>
    <text x="520" y="587" font-size="11.5" fill="#ece3ff">my emails... it ended up negotiating a corporate</text>
    <text x="520" y="602" font-size="11.5" fill="#ece3ff">partnership with my local pizza guy 🍕🤖</text>
  </g>

  <!-- bottom gradient bar -->
  <rect x="0" y="634" width="1000" height="6" rx="3" fill="url(#accent)"/>
</svg>
